name: jsonata-js sync
# When jsonata-js master moves, port each new jsonata-js commit as its own commit (bumping the vendor/jsonata-js
# submodule, and having Claude port any src/ and test/ changes, following AGENTS.md), and open or update a PR from
# the jsonata-js-sync branch, rebased onto master. The steps are in bin/jsonata-js-sync.
on:
  schedule:
  - cron: '30 6 * * *' # daily at 06:30 (UTC)
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false
permissions:
  contents: write      # push the jsonata-js-sync branch
  pull-requests: write # open and update the PR
  actions: write       # run CI on the branch, as pushes made with GITHUB_TOKEN do not trigger workflows
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # the full history, to rebase the sync branch onto
        # Keep the token out of .git/config, so Claude cannot push; bin/jsonata-js-sync pushes explicitly
        persist-credentials: false
    - name: Check for jsonata-js changes
      id: check
      run: bin/jsonata-js-sync check
    - uses: ruby/setup-ruby@v1
      if: steps.check.outputs.sync == 'true'
      with:
        ruby-version: '3.1' # the oldest supported version, so the port does not use newer syntax
        bundler-cache: true
    - name: Install Claude Code
      if: steps.check.outputs.sync == 'true'
      run: npm install --global @anthropic-ai/claude-code
    - name: Sync jsonata-js commits and open or update the pull request
      if: steps.check.outputs.sync == 'true'
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: bin/jsonata-js-sync sync
